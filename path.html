<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heritage Readiness Model - Path</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --stone: #EDE8DC; --stone-dim: #E1DACB; --ink: #23261F; --ink-soft: #4A4E42;
    --olive: #6B7A5E; --olive-deep: #4F5C45; --clay: #A8623D; --slate: #3D5A6C;
    --gold: #B8933A; --alert: #A13D2E; --line: rgba(35,38,31,0.14);
    --path1-bg: #FFFFFF; --path2-bg: #EAF0E4; --path3-bg: #FBEADC;
  }
  * { box-sizing: border-box; }
  .page-shell { display: flex; align-items: flex-start; }
  .sidebar {
    width: 260px; flex-shrink: 0; background: #fff; border-right: 1px solid var(--line);
    padding: 28px 22px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
    scrollbar-width: thin; scrollbar-color: var(--line) transparent;
  }
  .sidebar::-webkit-scrollbar { width: 6px; }
  .sidebar::-webkit-scrollbar-track { background: transparent; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  .sidebar::-webkit-scrollbar-thumb:hover { background: var(--ink-soft); }
  .sidebar h2 { font-size: 1.05rem; margin: 0 0 4px; font-family: 'Fraunces', serif; color: var(--ink); }
  .sidebar .sidebar-sub { font-size: 0.82rem; color: var(--ink-soft); margin-bottom: 20px; }
  .site-link { display: block; padding: 10px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); }
  .site-link:last-child { border-bottom: none; }
  .site-link .site-name { font-weight: 500; font-size: 0.94rem; }
  .site-link .site-region { font-size: 0.8rem; color: var(--ink-soft); font-family: 'IBM Plex Mono', monospace; margin-top: 2px; }
  .site-link-reference { background: #F2F2F0; padding: 10px 10px; border-radius: 4px; border-bottom: 1px solid var(--line); border-left: 3px solid #9B9B94; margin-bottom: 4px; }
  .reference-tag { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; color: #7A7A73; font-weight: 600; letter-spacing: 0.03em; margin-bottom: 3px; }
  .site-link-active { background: #E6F7E9; padding: 10px 10px; border-radius: 4px; border-bottom: 1px solid var(--line); border-left: 3px solid #2EA84A; margin-bottom: 4px; }
  .active-tag { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; color: #1F7A38; font-weight: 600; letter-spacing: 0.03em; margin-bottom: 3px; }
  .site-link-current { outline: 2px solid var(--ink); outline-offset: -2px; }
  .add-case-btn { display: block; text-align: center; font-size: 0.85rem; font-weight: 600; padding: 10px 14px; margin: 8px 0 18px; border: 1px dashed var(--olive); border-radius: 4px; color: var(--olive-deep); text-decoration: none; }
  .add-case-btn:hover { background: var(--stone-dim); }
  .sidebar-error, .sidebar-empty { font-size: 0.85rem; color: var(--ink-soft); }
  .main-col { flex: 1; min-width: 0; }
  @media (max-width: 760px) { .page-shell { display: block; } .sidebar { position: static; height: auto; width: auto; border-right: none; border-bottom: 1px solid var(--line); } }
  body { margin: 0; background: var(--stone); color: var(--ink); font-family: 'IBM Plex Sans', sans-serif; line-height: 1.55; font-size: 17px; }
  h1, h2, h3, .display { font-family: 'Fraunces', serif; font-weight: 500; color: var(--ink); letter-spacing: -0.01em; }
  code, .mono { font-family: 'IBM Plex Mono', monospace; }
  a { color: var(--slate); }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 28px; }

  .topnav { background: var(--ink); color: var(--stone); padding: 18px 0; }
  .topnav .wrap { display: flex; justify-content: space-between; align-items: center; }
  .topnav a.back { color: var(--gold); font-size: 0.9rem; text-decoration: none; }
  .topnav a.back:hover { text-decoration: underline; }
  .topnav .brand { font-family: 'IBM Plex Mono', monospace; font-size: 0.82rem; color: #C9C3B2; }

  /* ---------- Path tab switcher ---------- */
  .tabbar { background: #201E17; }
  .tabbar .wrap { display: flex; gap: 2px; }
  .tab {
    padding: 14px 20px; font-size: 0.88rem; color: #A29C8C; text-decoration: none;
    border-bottom: 3px solid transparent; font-family: 'IBM Plex Mono', monospace;
  }
  .tab.active { color: var(--stone); border-bottom-color: var(--gold); background: rgba(255,255,255,0.03); }
  .tab .tab-pct { margin-left: 6px; opacity: 0.7; }

  .hero { background: var(--ink); color: var(--stone); padding: 44px 0 40px; }
  .hero .path-label { font-family: 'IBM Plex Mono', monospace; color: var(--gold); font-size: 0.85rem; }
  .hero h1 { font-size: clamp(1.7rem, 3.6vw, 2.4rem); color: var(--stone); margin: 8px 0 4px; }
  .hero .sitename { color: #C9C3B2; font-size: 1rem; margin-bottom: 22px; }
  .hero-stats { display: flex; gap: 36px; align-items: flex-end; flex-wrap: wrap; }
  .hero-pct { font-family: 'Fraunces', serif; font-size: 3.4rem; font-weight: 500; line-height: 1; }
  .decision-methodology-link {
    display: block; text-align: center; font-size: 1.15rem; font-weight: 700; margin: 0 0 16px;
    color: var(--gold); text-decoration: none; padding: 12px; border: 2px dashed var(--gold); border-radius: 6px;
  }
  .decision-methodology-link:hover { background: rgba(184,147,58,0.08); }
  .profile-selector { font-size: 0.9rem; text-align: center; }
  .profile-selector label { font-weight: 600; margin-right: 8px; }
  .profile-selector select { padding: 6px 10px; border: 1px solid var(--line); border-radius: 4px; font-family: 'IBM Plex Sans', sans-serif; font-size: 0.9rem; }
  .hero-status-badge { font-size: 0.9rem; font-family: 'IBM Plex Mono', monospace; padding: 6px 16px; border-radius: 3px; }

  .status-ready { background: rgba(107,122,94,0.22); color: #B7C6A9; }
  .status-needs_evidence { background: rgba(184,147,58,0.25); color: #E3C572; }
  .status-major_gap { background: rgba(168,98,61,0.25); color: #E0A480; }
  .status-critical_gap { background: rgba(161,61,46,0.25); color: #F0958A; }
  .status-not_started { background: rgba(255,255,255,0.08); color: #C9C3B2; }

  /* ---------- Gatekeeper alert ---------- */
  .gatekeeper-alert {
    background: var(--alert); color: #fff; padding: 16px 0;
  }
  .gatekeeper-alert .wrap { display: flex; align-items: center; gap: 12px; }
  .gatekeeper-alert .icon { font-size: 1.3rem; }
  .gatekeeper-alert strong { font-weight: 600; }
  .gatekeeper-alert p { margin: 2px 0 0; font-size: 0.9rem; opacity: 0.92; }

  section { padding: 52px 0; }
  section.alt { background: var(--stone-dim); }
  h2.section-title { font-size: clamp(1.4rem, 2.6vw, 1.85rem); margin: 0 0 10px; }
  p.kicker { font-size: 0.94rem; color: var(--ink-soft); max-width: 66ch; margin: 0 0 30px; }

  /* ---------- Criteria list ---------- */
  .satisfaction-note {
    display: inline-block; font-size: 0.82rem; font-family: 'IBM Plex Mono', monospace;
    padding: 4px 12px; border-radius: 3px; background: rgba(61,90,108,0.12); color: var(--slate); margin-bottom: 22px;
  }
  .criterion-row {
    display: flex; gap: 14px; align-items: flex-start; padding: 14px 0; border-bottom: 1px solid var(--line);
  }
  .criterion-row:last-child { border-bottom: none; }
  .criterion-code {
    font-family: 'IBM Plex Mono', monospace; font-size: 0.85rem; font-weight: 600;
    background: #fff; border: 1px solid var(--line); border-radius: 3px; padding: 3px 9px; flex-shrink: 0;
  }
  .criterion-row.claimed .criterion-code { background: var(--olive); color: #fff; border-color: var(--olive); }
  .criterion-desc { font-size: 0.92rem; color: var(--ink-soft); }
  .criterion-justification { font-size: 0.88rem; color: var(--ink); margin-top: 4px; font-style: italic; }

  /* ---------- Stage blocks (shared style with site.html) ---------- */
  .stage-block { margin-bottom: 40px; }
  .stage-block h3 { font-size: 1.2rem; margin: 0 0 6px; }
  .stage-block .stage-desc { font-size: 0.9rem; color: var(--ink-soft); margin-bottom: 16px; max-width: 66ch; }
  .stage-example { font-size: 0.85rem; color: var(--olive-deep); font-style: italic; margin: -8px 0 16px; }
  .scope-tag { font-family: 'IBM Plex Mono', monospace; font-size: 0.62rem; color: var(--ink-soft); font-weight: 500; background: var(--stone-dim); padding: 2px 7px; border-radius: 3px; vertical-align: middle; margin-left: 6px; }
  .quick-checklist { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 4px 16px; margin-bottom: 18px; }
  .checklist-row { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; padding: 3px 0; }
  .checklist-row .check-mark { font-weight: 700; width: 16px; text-align: center; }
  .checklist-row.check-yes .check-mark { color: var(--olive-deep); }
  .checklist-row.check-no .check-mark { color: var(--ink-soft); opacity: 0.5; }
  .checklist-row.check-no .check-name { color: var(--ink-soft); }
  .checklist-row.check-partial .check-name { color: var(--ink); }
  .checklist-label { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; color: var(--ink-soft); letter-spacing: 0.03em; margin-bottom: 8px; }
  .checklist-legend { display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: 0.78rem; color: var(--ink-soft); margin-bottom: 12px; }
  .pending-review-tag {
    display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; font-weight: 600;
    color: var(--gold); border: 1px solid var(--gold); padding: 2px 8px; border-radius: 3px; margin-bottom: 6px;
  }
  .pending-review-row { border-left-color: var(--gold) !important; background: #FBF3E2; }
  .outcome-badge-inscribed { background: rgba(107,122,94,0.25); color: #B7C6A9; }
  .outcome-badge-not-pursued { background: rgba(255,255,255,0.08); color: #C9C3B2; }
  .qa-row { border-bottom: 1px solid var(--line); padding: 14px 0; }
  .qa-row:last-child { border-bottom: none; }
  .qa-prompt { font-size: 0.94rem; font-weight: 500; margin-bottom: 4px; }
  .qa-answer { font-size: 0.94rem; color: var(--ink-soft); }
  .qa-empty { font-size: 0.9rem; color: var(--ink-soft); font-style: italic; }
  .qa-status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; }

  /* ---------- Comparators ---------- */
  .comparator-list { display: flex; flex-direction: column; gap: 10px; }
  .comparator-row {
    background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px;
  }
  .comparator-row .name { font-weight: 500; font-size: 0.95rem; }
  .comparator-row .lesson { font-size: 0.86rem; color: var(--ink-soft); margin-top: 4px; }
  .comparator-row .notes { font-size: 0.86rem; color: var(--ink); margin-top: 6px; font-style: italic; border-left: 2px solid var(--olive); padding-left: 10px; }

  /* ---------- Feedback ---------- */
  .feedback-box {
    background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--gold);
    border-radius: 4px; padding: 22px 24px;
  }
  .feedback-box.path-bg-1 { background: var(--path1-bg); }
  .feedback-box.path-bg-2 { background: var(--path2-bg); }
  .feedback-box.path-bg-3 { background: var(--path3-bg); }
  .path-number { font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; font-weight: 600; color: var(--ink-soft); vertical-align: middle; }
  .tab .path-number { color: inherit; opacity: 0.7; }
  .feedback-box .generated { font-size: 0.8rem; color: var(--ink-soft); font-family: 'IBM Plex Mono', monospace; margin-bottom: 10px; }
  .feedback-box .text { font-size: 0.96rem; }
  .summary-para { font-size: 0.96rem; color: var(--ink); margin: 0 0 12px; line-height: 1.65; }
  .summary-numbered-list { margin: 0 0 12px; padding-left: 22px; font-size: 0.96rem; line-height: 1.6; }
  .summary-numbered-list li { margin-bottom: 4px; }
  .summary-para:last-child { margin-bottom: 0; }
  .next-actions { margin-top: 16px; padding-left: 20px; }
  .next-actions li { font-size: 0.92rem; margin-bottom: 6px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--ink-soft); }

  /* ---------- Evidence tier tags ---------- */
  .evidence-list { margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }
  .evidence-item { font-size: 0.85rem; color: var(--ink-soft); }
  .tier-tag {
    display: inline-block;
    font-size: 0.68rem;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 3px;
    margin-right: 8px;
    letter-spacing: 0.02em;
  }
  .tier-verified { background: rgba(107,122,94,0.18); color: var(--olive-deep); }
  .tier-lead { background: rgba(184,147,58,0.2); color: #8A6B1E; }
  .lead-row { border-left: 3px solid var(--gold); }
  .empty-state h2 { color: var(--ink); }

  footer { padding: 44px 0 60px; color: var(--ink-soft); font-size: 0.88rem; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  footer a { color: var(--ink-soft); }
</style>
</head>
<body>

<div class="page-shell">
<aside class="sidebar">
  <h2>Case Studies</h2>
  <p class="sidebar-sub">All sites assessed with this model.</p>
  <div id="site-list">
    <p class="mono" style="font-size:0.82rem; color:var(--ink-soft);">Loading&hellip;</p>
  </div>
</aside>
<div class="main-col">

<div class="topnav">
  <div class="wrap">
    <a class="back" href="index.html">&larr; All Case Studies</a>
    <span class="brand">HERITAGE READINESS MODEL</span>
  </div>
</div>

<div id="app">
  <div class="empty-state wrap"><p class="mono">Loading path data&hellip;</p></div>
</div>

<footer>
  <div class="wrap" style="display:flex; justify-content:space-between; width:100%; flex-wrap:wrap; gap:10px;">
    <span class="mono">v0.1.0</span>
    <a href="https://github.com/minteha/heritage-readiness-model" class="mono">github.com/minteha/heritage-readiness-model</a>
  </div>
</footer>

</div>

<script>
const SUPABASE_URL = 'https://dntqhsrxbmhdbfyqnimk.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRudHFoc3J4Ym1oZGJmeXFuaW1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4OTk1NTIsImV4cCI6MjEwNDQ3NTU1Mn0.SyxoJflfFLX3UkqK7HKaJES2DGdjuI5BjnWz3YYIsiE';
const headers = { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` };

const STATUS_LABEL = { ready: 'Ready', needs_evidence: 'Needs Evidence', major_gap: 'Major Gap', critical_gap: 'Critical Gap', not_started: 'Not Started' };
const PATH_TRACK = { wh: 'world_heritage', ich_representative: 'ich', ich_urgent: 'ich' };

function getParam(name) { return new URLSearchParams(window.location.search).get(name); }

async function api(path) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { headers });
  if (!res.ok) throw new Error(`Fetch failed: ${path}`);
  return res.json();
}

async function apiRpc(fn, params) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { ...headers, 'Content-Type': 'application/json' },
    body: JSON.stringify(params)
  });
  if (!res.ok) throw new Error(`RPC failed: ${fn}`);
  return res.json();
}

function renderEmpty(message) {
  document.getElementById('app').innerHTML = `
    <div class="empty-state wrap">
      <h2>${message}</h2>
      <p><a href="index.html">&larr; Back to all case studies</a></p>
    </div>`;
}

async function renderPath() {
  const siteId = getParam('site');
  const pathId = getParam('path');
  const selectedProfileId = getParam('profile') || null;
  if (!siteId || !pathId) { renderEmpty('No site or path selected.'); return; }

  let site;
  try {
    const sites = await api(`sites?site_id=eq.${siteId}&select=*`);
    if (!sites.length) { renderEmpty('Site not found.'); return; }
    site = sites[0];
  } catch (e) {
    renderEmpty('Could not load site data. Check the database connection.');
    console.error(e);
    return;
  }

  const allPaths = await apiRpc('get_path_comparison', { p_site_id: siteId, p_profile_id: selectedProfileId });
  const thisPath = allPaths.filter(p => p.criteria_list_id === pathId);
  const scoringProfiles = await api(`scoring_profiles?select=*&order=created_at.asc`);

  if (!thisPath.length) { renderEmpty('Path not found for this site.'); return; }
  const pathInfo = thisPath[0];
  const trackId = pathInfo.track_id;

  document.title = `${site.name} - ${pathInfo.path_name} - Heritage Readiness Model`;

  const [stages, allCriteria, claimedCriteria, assessmentAnswers, comparisons, allCaseStudies, feedback, siteStages, siteAnswers, allStages, stageStatus, unanswered, evidenceList, researchLeads] = await Promise.all([
    api(`stages?scope=eq.path&order=stage_number.asc`),
    api(`criteria?list_id=eq.${pathId}&order=sort_order.asc`),
    api(`assessment_criteria?assessment_id=eq.${pathInfo.assessment_id}&select=*`),
    api(`assessment_answers?assessment_id=eq.${pathInfo.assessment_id}&select=*,assessment_questions(prompt,stage_number,question_type),evidence_records(description,source_citation,verification_tier)`),
    api(`assessment_comparisons?assessment_id=eq.${pathInfo.assessment_id}&select=*,case_studies(name,key_lesson)`),
    api(`case_studies?track_id=eq.${trackId}&select=*`),
    api(`assessment_feedback?assessment_id=eq.${pathInfo.assessment_id}&is_current=eq.true&select=*`),
    api(`stages?scope=eq.site&order=stage_number.asc`),
    api(`site_answers?site_id=eq.${siteId}&select=*,assessment_questions(prompt,stage_number,question_type),evidence_records(description,source_citation,verification_tier)`),
    api(`stages?select=stage_number,name,description,scope,source_type&order=stage_number.asc`),
    api(`assessment_stage_status?assessment_id=eq.${pathInfo.assessment_id}&select=*&order=stage_number.asc`),
    api(`site_unanswered_questions?site_id=eq.${siteId}&select=*`),
    api(`site_evidence_list?site_id=eq.${siteId}&select=*`),
    api(`research_leads?site_id=eq.${siteId}&status=eq.open&select=*,stages(name)&order=priority.asc`)
  ]);
  const stageInfoByNumber = {};
  allStages.forEach(s => { stageInfoByNumber[s.stage_number] = s; });
  const isInscribed = pathInfo.real_outcome === 'inscribed';
  const isNotPursued = pathInfo.real_outcome === 'not_pursued';

  // ---- Tab switcher ----
  const pathOrder = ['wh', 'ich_representative', 'ich_urgent'];
  const PATH_NUMBER = { wh: 'Path 1', ich_representative: 'Path 2', ich_urgent: 'Path 3' };
  const PATH_BG_CLASS = { wh: 'path-bg-1', ich_representative: 'path-bg-2', ich_urgent: 'path-bg-3' };

  const tabsHtml = pathOrder.map(id => {
    const p = allPaths.find(x => x.criteria_list_id === id);
    if (!p) return '';
    const active = id === pathId;
    return `<a class="tab ${active ? 'active' : ''}" href="path.html?site=${siteId}&path=${id}">
      <span class="path-number">${PATH_NUMBER[id]}</span> ${p.path_name.split('(')[0].trim()}<span class="tab-pct">${p.coverage_pct}%</span>
    </a>`;
  }).join('');

  // ---- Stages applicable to this track (path-scoped) plus all site-scoped
  // stages, since those genuinely affect this path's real status too, and
  // were previously invisible on this page entirely.
  const applicableStages = stages.filter(st => st.track_applicability === 'both' || st.track_applicability === trackId);

  const STAGE_EXAMPLE = {
    0: 'Example: checking whether a practice is already in a national ICH inventory.',
    1: 'Example: name, coordinates, and Tentative List status for the site.',
    2: 'Example: a short summary of the site\'s history and physical setting.',
    3: 'Example: choosing which World Heritage criterion, like (v), the site actually argues for.',
    4: 'Example: tree age, system age, and continuity of use tracked as separate facts, not blended together.',
    5: 'Example: does the boundary include the whole working landscape, or just isolated fields?',
    6: 'Example: is the site still made of its original materials and form, not a modern reconstruction?',
    7: 'Example: comparing against Battir, Lavaux, and Serra de Tramuntana.',
    8: 'Example: has the community given consent, and how many people still practice the tradition?',
    9: 'Example: rating each building or component as good, at risk, or gone.',
    10: 'Example: a specific construction plan, with a real document date and figures.',
    11: 'Example: a numbered law or directive that actually protects the site.',
    12: 'Example: who is responsible for the site day to day, and what they\'ve committed to.',
    13: 'Example: is anyone still making a living from the tradition today?',
    14: 'Example: mapped core and buffer zones, with real coordinates.',
    15: 'Example: a live summary of what is documented, what is missing, and what to do next.'
  };

  const generateAutoSummary = () => {
    const rows = stageStatus || [];
    if (!rows.length) return null;
    const ready = rows.filter(r => r.stage_status === 'ready');
    const started = rows.filter(r => r.stage_status !== 'ready' && r.stage_status !== 'not_started' && Number(r.coverage_pct) > 0);
    const untouched = rows.filter(r => r.stage_status === 'not_started' || Number(r.coverage_pct) === 0);
    const totalAnswered = rows.reduce((s, r) => s + Number(r.answered_questions), 0);
    const totalQuestions = rows.reduce((s, r) => s + Number(r.total_questions), 0);
    const totalModelStages = allStages.length;

    const numberedList = list => `<ol class="summary-numbered-list">${list.map(r => `<li>${r.stage_name}</li>`).join('')}</ol>`;

    const blocks = [];
    blocks.push(`<p class="summary-para">No one has written a recommendation for this path yet, so here is what the underlying data actually shows. This model tracks ${totalModelStages} total stages; ${rows.length} of them apply to this path, covering ${totalAnswered} of ${totalQuestions} questions. Of those ${rows.length} stages, ${ready.length} are fully complete, ${started.length} are partially documented, and ${untouched.length} have not been started at all.</p>`);
    if (ready.length) blocks.push(`<p class="summary-para" style="margin-bottom:4px;">Fully documented (${ready.length} of ${rows.length}):</p>${numberedList(ready)}`);
    if (started.length) blocks.push(`<p class="summary-para" style="margin-bottom:4px;">Partially documented (${started.length} of ${rows.length}):</p>${numberedList(started)}`);
    if (untouched.length) blocks.push(`<p class="summary-para" style="margin-bottom:4px;">Not started at all (${untouched.length} of ${rows.length}):</p>${numberedList(untouched)}`);
    return blocks.join('');
  };

  // Splits a long written recommendation into real paragraphs on natural
  // sentence breaks, so a dense multi-sentence answer reads as short
  // paragraphs instead of one unbroken block.
  const formatLongText = text => {
    if (!text) return '';
    const sentences = text.match(/[^.!?]+[.!?]+/g) || [text];
    const paragraphs = [];
    let current = '';
    sentences.forEach(s => {
      current += s;
      if (current.length > 220) { paragraphs.push(current.trim()); current = ''; }
    });
    if (current.trim()) paragraphs.push(current.trim());
    return paragraphs.map(p => `<p class="summary-para">${p}</p>`).join('');
  };

  const renderChecklist = () => {
    const rows = stageStatus || [];
    if (!rows.length) return '';
    const ready = rows.filter(r => r.stage_status === 'ready');
    const partial = rows.filter(r => r.stage_status !== 'ready' && Number(r.coverage_pct) > 0);
    const untouched = rows.filter(r => r.stage_status !== 'ready' && Number(r.coverage_pct) === 0);
    const row = (r, mark) => `
      <div class="checklist-row check-${mark === '\u2705' ? 'yes' : (mark === '\ud83d\udd36' ? 'partial' : 'no')}">
        <span class="check-mark">${mark}</span>
        <span class="check-name">${r.stage_name}</span>
      </div>`;
    return `<div class="quick-checklist">${ready.map(r => row(r, '\u2705')).join('')}${partial.map(r => row(r, '\ud83d\udd36')).join('')}${untouched.map(r => row(r, '\u274c')).join('')}</div>`;
  };

  const renderSourcePointer = p => {
    if (!p) return '';
    const isUrl = /^https?:\/\//i.test(p);
    return isUrl ? `<a href="${p}" target="_blank" rel="noopener">${p}</a>` : p;
  };
  const openLeadsHtml = researchLeads.length
    ? `<div class="comparator-list">${researchLeads.map(l => `
        <div class="comparator-row ${l.is_pending_review ? 'pending-review-row' : ''}">
          ${l.is_pending_review ? `<span class="pending-review-tag">PENDING REVIEW, SUBMITTED BY ${(l.submitted_by || 'UNKNOWN').toUpperCase()}</span>` : ''}
          <div class="name">${l.description}</div>
          <div class="lesson">${l.stages ? l.stages.name : 'General'}${l.source_pointer ? ' &middot; ' + renderSourcePointer(l.source_pointer) : ''}</div>
        </div>`).join('')}</div>`
    : `<p class="qa-empty">No open research leads right now.</p>`;

  const evidenceListHtml = evidenceList && evidenceList.length
    ? `<div class="comparator-list">${evidenceList.map(e => `
        <div class="comparator-row">
          <div class="name">${e.file_reference ? `<a href="${e.file_reference}" target="_blank" rel="noopener">${e.source_citation || e.description}</a>` : (e.source_citation || e.description)}</div>
          <div class="lesson">${e.description}</div>
          <span class="tier-tag tier-${e.verification_tier}">${(e.verification_tier || '').toUpperCase()}</span>
        </div>`).join('')}</div>`
    : `<p class="qa-empty">No evidence recorded yet for this site.</p>`;

  const claimedIds = new Set(claimedCriteria.map(c => c.criterion_id));
  const criteriaHtml = allCriteria.map(c => {
    const claim = claimedCriteria.find(cc => cc.criterion_id === c.criterion_id);
    return `
      <div class="criterion-row ${claim ? 'claimed' : ''}">
        <span class="criterion-code">${c.code}</span>
        <div>
          <div class="criterion-desc">${c.description}</div>
          ${claim && claim.justification ? `<div class="criterion-justification">${claim.justification}</div>` : ''}
        </div>
      </div>`;
  }).join('');

  const answersByStage = {};
  assessmentAnswers.forEach(a => {
    const sn = a.assessment_questions.stage_number;
    (answersByStage[sn] = answersByStage[sn] || []).push(a);
  });
  siteAnswers.forEach(a => {
    const sn = a.assessment_questions.stage_number;
    (answersByStage[sn] = answersByStage[sn] || []).push(a);
  });

  const statusColor = s => ({ ready: 'var(--olive)', needs_evidence: 'var(--gold)', major_gap: 'var(--clay)', critical_gap: 'var(--alert)' }[s] || 'var(--line)');

  const renderEvidenceItem = e => `
    <span class="evidence-item">
      <span class="tier-tag tier-${e.verification_tier}">${e.verification_tier === 'verified' ? 'VERIFIED' : 'LEAD'}</span>
      ${e.source_citation || e.description}
    </span>`;

  // Combine path-scoped stages (applicable to this track) with all
  // site-scoped stages, since site-level facts genuinely affect this
  // path's real status and were previously invisible on this page.
  const allApplicableStages = [...applicableStages, ...siteStages].sort((a, b) => a.stage_number - b.stage_number);

  const stagesHtml = allApplicableStages.filter(st => st.stage_number !== 3 && st.stage_number !== 7).map(st => {
    const answers = answersByStage[st.stage_number] || [];
    const rows = answers.length
      ? answers.map(a => `
          <div class="qa-row">
            <div class="qa-prompt"><span class="qa-status-dot" style="background:${statusColor(a.status)}"></span>${a.assessment_questions.prompt}</div>
            <div class="qa-answer">${(a.answer_value && a.answer_value.value) ? a.answer_value.value : JSON.stringify(a.answer_value)}</div>
            ${a.evidence_records && a.evidence_records.length ? `<div class="evidence-list">${a.evidence_records.map(renderEvidenceItem).join('')}</div>` : ''}
          </div>`).join('')
      : `<p class="qa-empty">Not yet assessed.</p>`;
    return `<div class="stage-block">
      <h3>${st.name} <span class="scope-tag">${st.scope === 'site' ? 'SITE-WIDE' : 'PATH-SPECIFIC'}</span></h3>
      <p class="stage-desc">${st.description}</p>
      ${STAGE_EXAMPLE[st.stage_number] ? `<p class="stage-example">${STAGE_EXAMPLE[st.stage_number]}</p>` : ''}
      ${rows}
    </div>`;
  }).join('');


  // ---- Research Leads: path-specific leads, gathered into one visible
  // to-do list rather than left buried inside individual stage blocks.
  const allLeads = [];
  assessmentAnswers.forEach(a => {
    (a.evidence_records || []).forEach(e => {
      if (e.verification_tier === 'lead') {
        allLeads.push({ prompt: a.assessment_questions.prompt, ...e });
      }
    });
  });
  const leadsHtml = allLeads.length
    ? `<div class="comparator-list">${allLeads.map(l => `
        <div class="comparator-row lead-row">
          <div class="name">${l.source_citation || l.description}</div>
          <div class="lesson">Relates to: ${l.prompt}</div>
        </div>`).join('')}</div>`
    : `<p class="qa-empty">No open research leads right now.</p>`;

  // ---- Comparative analysis: recorded comparisons, or the reference list if none yet ----
  const comparisonHtml = comparisons.length
    ? `<div class="comparator-list">${comparisons.map(c => `
        <div class="comparator-row">
          <div class="name">${c.case_studies.name}</div>
          <div class="lesson">${c.case_studies.key_lesson}</div>
          ${c.comparison_notes ? `<div class="notes">${c.comparison_notes}</div>` : ''}
        </div>`).join('')}</div>`
    : `<p class="qa-empty" style="margin-bottom:16px;">No comparison recorded yet for this path. Reference comparators for this track:</p>
       <div class="comparator-list">${allCaseStudies.map(c => `
        <div class="comparator-row">
          <div class="name">${c.name}</div>
          <div class="lesson">${c.key_lesson}</div>
        </div>`).join('')}</div>`;

  // ---- Feedback ----
  const feedbackHtml = isNotPursued
    ? `<p class="qa-empty">${pathInfo.outcome_note || 'This path was not used for this case.'}</p>`
    : (feedback.length
      ? `<div class="feedback-box ${PATH_BG_CLASS[pathId]}">
          <div class="generated">${isInscribed ? 'Already inscribed' : 'Generated ' + new Date(feedback[0].generated_at).toLocaleDateString()}</div>
          <div class="text">${formatLongText(feedback[0].feedback_text)}</div>
          ${feedback[0].next_actions && feedback[0].next_actions.length ? `
            <div class="checklist-label" style="margin-top:16px;">${isInscribed ? 'WHAT THIS TEACHES US FOR MI\u2019ILYA' : 'RECOMMENDATION: WHAT TO DO NEXT'}</div>
            <ul class="next-actions">${feedback[0].next_actions.map(a => `<li>${a}</li>`).join('')}</ul>` : ''}
        </div>`
      : `<div class="feedback-box ${PATH_BG_CLASS[pathId]}">
          <div class="generated">Auto-generated from stage data</div>
          <div class="text">${generateAutoSummary() || '<p class="qa-empty">No stage data exists yet for this path.</p>'}</div>
        </div>`);

  const gatekeeperAlert = pathInfo.failed_gatekeepers > 0 ? `
    <div class="gatekeeper-alert">
      <div class="wrap">
        <span class="icon">⚠</span>
        <div>
          <strong>${pathInfo.failed_gatekeepers} gatekeeper requirement${pathInfo.failed_gatekeepers > 1 ? 's' : ''} not met.</strong>
          <p>This path cannot be marked Ready regardless of coverage elsewhere. A gatekeeper failure is decisive on its own.</p>
        </div>
      </div>
    </div>` : '';

  document.getElementById('app').innerHTML = `
    <div class="tabbar"><div class="wrap">${tabsHtml}</div></div>
    <div class="hero">
      <div class="wrap">
        <span class="path-label">${trackId === 'world_heritage' ? '1972 CONVENTION' : '2003 CONVENTION'} \u00b7 ${pathInfo.satisfaction_rule === 'all_required' ? 'ALL CRITERIA REQUIRED' : 'AT LEAST ONE CRITERION'}</span>
        <h1>${pathInfo.path_name}</h1>
        <div class="sitename">${site.name}</div>
        <div class="hero-stats">
          <div class="hero-pct">${isInscribed ? pathInfo.outcome_year : pathInfo.coverage_pct + '%'}</div>
          <span class="hero-status-badge ${isInscribed ? 'outcome-badge-inscribed' : (isNotPursued ? 'outcome-badge-not-pursued' : 'status-' + pathInfo.overall_status)}">${isInscribed ? 'Evidence Used' : (isNotPursued ? 'Not Pursued' : (STATUS_LABEL[pathInfo.overall_status] || pathInfo.overall_status))}</span>
        </div>
      </div>
    </div>
    <section style="padding: 20px 0; border-bottom: 1px solid var(--line);">
      <div class="wrap">
        <a href="path-decision-methodology.html" class="decision-methodology-link">Click here to view the methodology of path decision choosing</a>
        ${scoringProfiles && scoringProfiles.length > 1 ? `
        <div class="profile-selector">
          <label for="profile-select">Viewing under scoring profile:</label>
          <select id="profile-select">
            ${scoringProfiles.map(p => `<option value="${p.profile_id}" ${(selectedProfileId === p.profile_id || (!selectedProfileId && p.is_default)) ? 'selected' : ''}>${p.name}${p.is_default ? ' (default)' : ''}</option>`).join('')}
          </select>
        </div>` : ''}
      </div>
    </section>
    ${gatekeeperAlert}

    <section>
      <div class="wrap">
        <h2 class="section-title">Criteria</h2>
        <span class="satisfaction-note">${pathInfo.satisfaction_rule === 'all_required' ? 'Every criterion below must be satisfied, no partial credit' : 'At least one criterion below must be satisfied'}</span>
        ${criteriaHtml}
      </div>
    </section>

    <section class="alt">
      <div class="wrap">
        <h2 class="section-title">Assessment</h2>
        <p class="kicker">Every stage that genuinely affects this path, site-wide facts and path-specific evidence together.</p>
        <div class="checklist-label">WHAT WE HAVE, AT A GLANCE</div>
        <div class="checklist-legend">
          <span>&#9989; Ready, fully documented and verified</span>
          <span>&#128310; Partially documented, has real content, not fully verified yet</span>
          <span>&#10060; Not started at all</span>
        </div>
        ${renderChecklist()}
        ${stagesHtml}
      </div>
    </section>

    <section>
      <div class="wrap">
        <h2 class="section-title">Comparative analysis</h2>
        ${comparisonHtml}
      </div>
    </section>

    <section class="alt">
      <div class="wrap">
        <h2 class="section-title">What to do next</h2>
        ${feedbackHtml}
      </div>
    </section>

    <section>
      <div class="wrap">
        <h2 class="section-title">Research leads</h2>
        <p class="kicker">Real leads worth following up, from across the whole site. These point research in the right direction, but need direct confirmation before they count as real evidence.</p>
        ${openLeadsHtml}
      </div>
    </section>

    <section class="alt">
      <div class="wrap">
        <h2 class="section-title">Unverified evidence tied to this path's own answers</h2>
        <p class="kicker">Specific sources cited directly against this path's questions, not yet confirmed firsthand.</p>
        ${leadsHtml}
      </div>
    </section>

    <section>
      <div class="wrap">
        <h2 class="section-title">Evidence &amp; sources</h2>
        <p class="kicker">Every real citation behind this case study, in one place. Click through to the original where a link exists.</p>
        ${evidenceListHtml}
      </div>
    </section>
  `;

  const profileSelect = document.getElementById('profile-select');
  if (profileSelect) {
    profileSelect.addEventListener('change', () => {
      const url = new URL(window.location.href);
      url.searchParams.set('profile', profileSelect.value);
      window.location.href = url.toString();
    });
  }
}

renderPath().catch(e => { console.error(e); renderEmpty('Something went wrong loading this path.'); });

// Shared sidebar, present on every page so switching between case studies
// never requires a trip back to the homepage.
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
async function loadSidebarSites() {
  const container = document.getElementById('site-list');
  const currentSiteId = getParam('site');
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/sites?select=*&order=is_reference_case.asc,name.asc`, { headers });
    if (!res.ok) throw new Error('fetch failed');
    const sites = await res.json();
    if (!sites.length) {
      container.innerHTML = '<p class="sidebar-empty">No case studies yet.</p>';
      return;
    }
    container.innerHTML = '';
    const activeSites = sites.filter(s => !s.is_reference_case);
    // Olive orchards are our actual primary nomination target, shown first.
    const PRIMARY_SITE_ID = '85b8c3ba-812d-4aa6-a4ef-02664245a540';
    activeSites.sort((a, b) => (a.site_id === PRIMARY_SITE_ID ? -1 : b.site_id === PRIMARY_SITE_ID ? 1 : 0));
    const referenceSites = sites.filter(s => s.is_reference_case);

    activeSites.forEach(s => {
      const a = document.createElement('a');
      a.className = `site-link site-link-active${s.site_id === currentSiteId ? ' site-link-current' : ''}`;
      a.href = `site.html?site=${encodeURIComponent(s.site_id)}`;
      const region = [s.region, s.country].filter(Boolean).join(', ');
      a.innerHTML = `
        <span class="active-tag">ACTIVE STUDY CASE</span>
        <div class="site-name">${escapeHtml(s.name)}</div>
        ${region ? `<div class="site-region">${escapeHtml(region)}</div>` : ''}
      `;
      container.appendChild(a);
    });

    const addCaseLink = document.createElement('a');
    addCaseLink.className = 'add-case-btn';
    addCaseLink.href = 'add-study-case.html';
    addCaseLink.innerHTML = '+ Add New Study Case';
    container.appendChild(addCaseLink);

    referenceSites.forEach(s => {
      const a = document.createElement('a');
      a.className = `site-link site-link-reference${s.site_id === currentSiteId ? ' site-link-current' : ''}`;
      a.href = `site.html?site=${encodeURIComponent(s.site_id)}`;
      const region = [s.region, s.country].filter(Boolean).join(', ');
      a.innerHTML = `
        <span class="reference-tag">COMPLETE STUDY CASE</span>
        <div class="site-name">${escapeHtml(s.name)}</div>
        ${region ? `<div class="site-region">${escapeHtml(region)}</div>` : ''}
      `;
      container.appendChild(a);
    });
  } catch (e) {
    container.innerHTML = '<p class="sidebar-error">Could not load case studies.</p>';
    console.error(e);
  }
}
loadSidebarSites();
</script>

</body>
</html>
