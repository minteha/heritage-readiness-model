<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heritage Readiness Model — Site</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --stone: #EDE8DC;
    --stone-dim: #E1DACB;
    --ink: #23261F;
    --ink-soft: #4A4E42;
    --olive: #6B7A5E;
    --olive-deep: #4F5C45;
    --clay: #A8623D;
    --slate: #3D5A6C;
    --gold: #B8933A;
    --alert: #A13D2E;
    --line: rgba(35,38,31,0.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--stone);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    line-height: 1.55;
    font-size: 17px;
  }
  h1, h2, h3, .display { font-family: 'Fraunces', serif; font-weight: 500; color: var(--ink); letter-spacing: -0.01em; }
  code, .mono { font-family: 'IBM Plex Mono', monospace; }
  a { color: var(--slate); }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 28px; }

  /* ---------- Top nav ---------- */
  .topnav {
    background: var(--ink);
    color: var(--stone);
    padding: 18px 0;
  }
  .topnav .wrap { display: flex; justify-content: space-between; align-items: center; }
  .topnav a.back { color: var(--gold); font-size: 0.9rem; text-decoration: none; }
  .topnav a.back:hover { text-decoration: underline; }
  .topnav .brand { font-family: 'IBM Plex Mono', monospace; font-size: 0.82rem; color: #C9C3B2; }

  /* ---------- Hero ---------- */
  .hero { background: var(--ink); color: var(--stone); padding: 40px 0 56px; }
  .hero h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); color: var(--stone); margin: 6px 0 10px; }
  .hero .meta { font-size: 0.95rem; color: #C9C3B2; }
  .hero .desc { max-width: 68ch; color: #D8D3C4; margin-top: 14px; font-size: 1.02rem; }
  .hero-actions { display: flex; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
  .hero-btn {
    font-family: 'IBM Plex Sans', sans-serif; font-size: 0.88rem; font-weight: 500;
    padding: 10px 18px; border-radius: 4px; border: 1px solid #6A6D5F; background: transparent;
    color: var(--stone); cursor: pointer; text-decoration: none; display: inline-block;
  }
  .hero-btn:hover { border-color: var(--gold); color: var(--gold); }
  .hero-btn-primary { background: var(--gold); border-color: var(--gold); color: var(--ink); font-weight: 600; }
  .hero-btn-primary:hover { color: var(--ink); opacity: 0.9; }

  section { padding: 56px 0; }
  section.alt { background: var(--stone-dim); }
  h2.section-title { font-size: clamp(1.4rem, 2.6vw, 1.85rem); margin: 0 0 10px; }
  p.kicker { font-size: 0.94rem; color: var(--ink-soft); max-width: 66ch; margin: 0 0 32px; }

  /* ---------- Path summary cards ---------- */
  .paths { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .path-card {
    background: #fff; border: 1px solid var(--line); border-radius: 4px;
    padding: 24px; display: flex; flex-direction: column; gap: 10px;
    text-decoration: none; color: var(--ink); position: relative;
    border-top: 5px solid var(--line);
  }
  .path-card:hover { box-shadow: 0 2px 10px rgba(35,38,31,0.08); }
  .path-card.recommended { border-top-color: var(--gold); background: #FBF3E2; }
  .path-card .label { font-size: 0.78rem; font-family: 'IBM Plex Mono', monospace; color: var(--ink-soft); }
  .path-card h3 { font-size: 1.1rem; margin: 0; }
  .path-card .pct { font-family: 'Fraunces', serif; font-size: 2.1rem; font-weight: 500; margin: 4px 0 0; }
  .path-card .status-badge {
    align-self: flex-start; font-size: 0.76rem; font-family: 'IBM Plex Mono', monospace;
    padding: 3px 10px; border-radius: 3px; margin-top: 6px;
  }
  .status-ready { background: rgba(107,122,94,0.15); color: var(--olive-deep); }
  .status-needs_evidence { background: rgba(184,147,58,0.18); color: #8A6B1E; }
  .status-major_gap { background: rgba(168,98,61,0.18); color: var(--clay); }
  .status-critical_gap { background: rgba(161,61,46,0.16); color: var(--alert); }
  .status-not_started { background: rgba(35,38,31,0.08); color: var(--ink-soft); }
  .recommended-tag {
    position: absolute; top: -11px; right: 16px; background: var(--gold); color: var(--ink);
    font-size: 0.72rem; font-family: 'IBM Plex Mono', monospace; padding: 3px 10px; border-radius: 3px;
  }

  /* ---------- Readiness summary ---------- */
  .readiness-grid { display: flex; flex-direction: column; gap: 18px; }
  .readiness-block {
    background: #fff; border: 1px solid var(--line); border-radius: 4px;
    border-left: 4px solid var(--line); padding: 22px 24px;
  }
  .readiness-block.recommended { border-left-color: var(--gold); background: #FBF3E2; }
  .readiness-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
  .readiness-head h3 { font-size: 1.15rem; margin: 0; }
  .readiness-summary { font-size: 0.96rem; color: var(--ink); margin: 0 0 16px; line-height: 1.6; }
  .readiness-label {
    font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; color: var(--ink-soft);
    letter-spacing: 0.03em; margin-bottom: 8px;
  }
  .readiness-actions { margin: 0 0 16px; padding-left: 20px; }
  .readiness-actions li { font-size: 0.9rem; margin-bottom: 6px; color: var(--ink); }
  .readiness-link { font-size: 0.85rem; font-weight: 500; text-decoration: none; }
  .readiness-link:hover { text-decoration: underline; }

  /* ---------- Stage details (collapsible, inside readiness block) ---------- */
  .stage-details { margin: 4px 0 16px; }
  .stage-details summary {
    cursor: pointer; font-size: 0.86rem; font-weight: 500; color: var(--slate);
    padding: 4px 0; list-style: none;
  }
  .stage-details summary::-webkit-details-marker { display: none; }
  .stage-details summary::before { content: '▸ '; }
  .stage-details[open] summary::before { content: '▾ '; }
  .stage-list { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
  .stage-row {
    background: var(--stone); border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px;
  }
  .stage-row-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .stage-row-name { font-weight: 500; font-size: 0.9rem; }
  .stage-status-badge { font-size: 0.68rem; padding: 2px 8px; }
  .stage-row-why { font-size: 0.83rem; color: var(--ink-soft); margin: 0 0 4px; }
  .stage-row-data { font-size: 0.78rem; color: var(--ink-soft); font-family: 'IBM Plex Mono', monospace; margin: 0; }

  /* ---------- Stage blocks ---------- */
  .stage-block { margin-bottom: 40px; }
  .stage-block h3 { font-size: 1.2rem; margin: 0 0 6px; }
  .stage-block .stage-desc { font-size: 0.9rem; color: var(--ink-soft); margin-bottom: 16px; max-width: 66ch; }
  .qa-row { border-bottom: 1px solid var(--line); padding: 14px 0; }
  .qa-row:last-child { border-bottom: none; }
  .qa-prompt { font-size: 0.94rem; font-weight: 500; margin-bottom: 4px; }
  .qa-answer { font-size: 0.94rem; color: var(--ink-soft); }
  .qa-empty { font-size: 0.9rem; color: var(--ink-soft); font-style: italic; }
  .qa-status-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px;
  }

  /* ---------- Components / threats lists ---------- */
  .item-list { display: flex; flex-direction: column; gap: 10px; }
  .item-row {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 12px 16px;
  }
  .item-row .name { font-weight: 500; font-size: 0.95rem; }
  .item-row .sub { font-size: 0.83rem; color: var(--ink-soft); font-family: 'IBM Plex Mono', monospace; }
  .pill { font-size: 0.76rem; font-family: 'IBM Plex Mono', monospace; padding: 3px 10px; border-radius: 3px; }
  .pill-good { background: rgba(107,122,94,0.15); color: var(--olive-deep); }
  .pill-medium { background: rgba(184,147,58,0.18); color: #8A6B1E; }
  .pill-at_risk { background: rgba(168,98,61,0.18); color: var(--clay); }
  .pill-gone { background: rgba(161,61,46,0.16); color: var(--alert); }
  .pill-ascertained { background: rgba(161,61,46,0.16); color: var(--alert); }
  .pill-potential { background: rgba(184,147,58,0.18); color: #8A6B1E; }

  .empty-state {
    text-align: center; padding: 60px 20px; color: var(--ink-soft);
  }
  .empty-state h2 { color: var(--ink); }

  /* ---------- Evidence tier tags ---------- */
  .evidence-list { margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }
  .evidence-item { font-size: 0.85rem; color: var(--ink-soft); }
  .tier-tag {
    display: inline-block;
    font-size: 0.68rem;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 3px;
    margin-right: 8px;
    letter-spacing: 0.02em;
  }
  .tier-verified { background: rgba(107,122,94,0.18); color: var(--olive-deep); }
  .tier-lead { background: rgba(184,147,58,0.2); color: #8A6B1E; }
  .lead-row { border-left: 3px solid var(--gold); }

  /* ---------- Sources to verify (priority tags) ---------- */
  .priority-tag {
    display: inline-block;
    font-size: 0.68rem;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 3px;
    letter-spacing: 0.02em;
  }
  .priority-high { background: rgba(161,61,46,0.16); color: var(--alert); }
  .priority-medium { background: rgba(184,147,58,0.2); color: #8A6B1E; }
  .priority-low { background: rgba(35,38,31,0.08); color: var(--ink-soft); }
  .verify-row.verify-high { border-left: 3px solid var(--alert); }
  .verify-row.verify-medium { border-left: 3px solid var(--gold); }
  .verify-row.verify-low { border-left: 3px solid var(--line); }
  .confirm-action {
    margin-top: 8px; font-size: 0.85rem; color: var(--ink); background: var(--stone-dim);
    padding: 8px 10px; border-radius: 3px;
  }
  .confirm-label { font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem; color: var(--olive-deep); font-weight: 600; margin-right: 6px; }
  .related-details { margin-top: 8px; }
  .related-details summary { cursor: pointer; font-size: 0.82rem; color: var(--slate); font-weight: 500; }
  .related-needs { margin: 8px 0 0; padding-left: 20px; }
  .related-needs li { font-size: 0.82rem; color: var(--ink-soft); margin-bottom: 4px; }

  footer { padding: 44px 0 60px; color: var(--ink-soft); font-size: 0.88rem; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  footer a { color: var(--ink-soft); }

  @media (max-width: 760px) {
    .paths { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="topnav">
  <div class="wrap">
    <a class="back" href="index.html">← All Case Studies</a>
    <span class="brand">HERITAGE READINESS MODEL</span>
  </div>
</div>

<div id="app">
  <div class="empty-state wrap"><p class="mono">Loading site data…</p></div>
</div>

<footer>
  <div class="wrap" style="display:flex; justify-content:space-between; width:100%; flex-wrap:wrap; gap:10px;">
    <span class="mono">v0.1.0</span>
    <a href="https://github.com/minteha/heritage-readiness-model" class="mono">github.com/minteha/heritage-readiness-model</a>
  </div>
</footer>

<script>
const SUPABASE_URL = 'https://dntqhsrxbmhdbfyqnimk.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRudHFoc3J4Ym1oZGJmeXFuaW1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4OTk1NTIsImV4cCI6MjEwNDQ3NTU1Mn0.SyxoJflfFLX3UkqK7HKaJES2DGdjuI5BjnWz3YYIsiE';
const headers = { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` };

const STATUS_LABEL = {
  ready: 'Ready', needs_evidence: 'Needs Evidence', major_gap: 'Major Gap',
  critical_gap: 'Critical Gap', not_started: 'Not Started'
};

function getParam(name) {
  return new URLSearchParams(window.location.search).get(name);
}

async function api(path) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { headers });
  if (!res.ok) throw new Error(`Fetch failed: ${path}`);
  return res.json();
}

function renderEmpty(message) {
  document.getElementById('app').innerHTML = `
    <div class="empty-state wrap">
      <h2>${message}</h2>
      <p><a href="index.html">← Back to all case studies</a></p>
    </div>`;
}

async function renderSite() {
  const siteId = getParam('site');
  if (!siteId) {
    renderEmpty('No site selected.');
    return;
  }

  let site;
  let relatedSite = null;
  try {
    const sites = await api(`sites?site_id=eq.${siteId}&select=*`);
    if (!sites.length) { renderEmpty('Site not found.'); return; }
    site = sites[0];
    if (site.related_site_id) {
      const related = await api(`sites?site_id=eq.${site.related_site_id}&select=site_id,name`);
      if (related.length) relatedSite = related[0];
    }
  } catch (e) {
    renderEmpty('Could not load site data. Check the database connection.');
    console.error(e);
    return;
  }

  document.title = `${site.name} — Heritage Readiness Model`;

  const [pathComparison, stages, siteAnswers, components, threats, mapFeatures, researchLeads, allStages] = await Promise.all([
    api(`site_path_comparison?site_id=eq.${siteId}&select=*`),
    api(`stages?scope=eq.site&order=stage_number.asc`),
    api(`site_answers?site_id=eq.${siteId}&select=*,assessment_questions(prompt,stage_number,question_type),evidence_records(description,source_citation,verification_tier,file_reference)`),
    api(`site_components?site_id=eq.${siteId}&select=*`),
    api(`threats?site_id=eq.${siteId}&select=*`),
    api(`map_features?site_id=eq.${siteId}&select=*`),
    api(`research_leads?site_id=eq.${siteId}&status=eq.open&select=*,stages(name)&order=priority.asc`),
    api(`stages?select=stage_number,name,description,scope,source_type&order=stage_number.asc`)
  ]);
  const stageInfoByNumber = {};
  allStages.forEach(s => { stageInfoByNumber[s.stage_number] = s; });

  // ---- Path summary cards ----
  const pathOrder = ['wh', 'ich_representative', 'ich_urgent'];
  const sortedPaths = pathOrder.map(id => pathComparison.find(p => p.criteria_list_id === id)).filter(Boolean);
  const pathCardsHtml = sortedPaths.map(p => `
    <a class="path-card ${p.is_recommended ? 'recommended' : ''}" href="path.html?site=${siteId}&path=${p.criteria_list_id}">
      ${p.is_recommended ? '<span class="recommended-tag">RECOMMENDED</span>' : ''}
      <span class="label">${p.track_id === 'world_heritage' ? '1972 CONVENTION' : '2003 CONVENTION'}</span>
      <h3>${p.path_name.split('(')[0].trim()}</h3>
      <div class="pct">${p.coverage_pct}%</div>
      <span class="status-badge status-${p.overall_status}">${STATUS_LABEL[p.overall_status] || p.overall_status}</span>
    </a>
  `).join('');

  // ---- Readiness summary: what we have / what's missing / recommendation,
  // plus which stages apply to this path and why, and what data exists for
  // each -- for all three paths at once, on the general site page.
  const feedbackByAssessment = {};
  const stageStatusByAssessment = {};
  await Promise.all(sortedPaths.map(async p => {
    const [fb, stageStatus] = await Promise.all([
      api(`assessment_feedback?assessment_id=eq.${p.assessment_id}&is_current=eq.true&select=*`),
      api(`assessment_stage_status?assessment_id=eq.${p.assessment_id}&select=*&order=stage_number.asc`)
    ]);
    if (fb.length) feedbackByAssessment[p.assessment_id] = fb[0];
    stageStatusByAssessment[p.assessment_id] = stageStatus;
  }));

  const renderStageList = assessmentId => {
    const rows = stageStatusByAssessment[assessmentId] || [];
    if (!rows.length) return '<p class="qa-empty">No stages apply to this path.</p>';
    return rows.map(st => {
      const info = stageInfoByNumber[st.stage_number];
      return `
        <div class="stage-row">
          <div class="stage-row-head">
            <span class="stage-row-name">${st.stage_name}</span>
            <span class="status-badge stage-status-badge status-${st.stage_status}">${STATUS_LABEL[st.stage_status] || st.stage_status} · ${st.coverage_pct}%</span>
          </div>
          <p class="stage-row-why">${info ? info.description : ''}</p>
          <p class="stage-row-data">${st.answered_questions} of ${st.total_questions} questions answered${st.source_type === 'official_unesco' ? ' · Official UNESCO requirement' : ' · Tool extension'}</p>
        </div>`;
    }).join('');
  };

  const readinessHtml = sortedPaths.map(p => {
    const fb = feedbackByAssessment[p.assessment_id];
    return `
      <div class="readiness-block readiness-${p.criteria_list_id} ${p.is_recommended ? 'recommended' : ''}">
        <div class="readiness-head">
          <h3>${p.path_name.split('(')[0].trim()}</h3>
          <span class="status-badge status-${p.overall_status}">${STATUS_LABEL[p.overall_status] || p.overall_status}</span>
        </div>
        ${fb ? `
          <p class="readiness-summary">${fb.feedback_text}</p>
          ${fb.next_actions && fb.next_actions.length ? `
            <div class="readiness-label">RECOMMENDATION — WHAT TO DO NEXT</div>
            <ul class="readiness-actions">${fb.next_actions.map(a => `<li>${a}</li>`).join('')}</ul>
          ` : ''}
        ` : `<p class="qa-empty">No summary generated yet for this path.</p>`}
        <details class="stage-details">
          <summary>Which stages apply to this path, and why</summary>
          <div class="stage-list">${renderStageList(p.assessment_id)}</div>
        </details>
        <a class="readiness-link" href="path.html?site=${siteId}&path=${p.criteria_list_id}">See full assessment →</a>
      </div>`;
  }).join('');

  // ---- Site-level stage Q&A, grouped ----
  const answersByStage = {};
  siteAnswers.forEach(a => {
    const sn = a.assessment_questions.stage_number;
    (answersByStage[sn] = answersByStage[sn] || []).push(a);
  });

  const statusColor = s => ({
    ready: 'var(--olive)', needs_evidence: 'var(--gold)',
    major_gap: 'var(--clay)', critical_gap: 'var(--alert)'
  }[s] || 'var(--line)');

  // Renders one evidence item with its tier badge -- VERIFIED (olive) or
  // LEAD (gold). A lead is a real, useful pointer (e.g. a newspaper
  // mention) that just hasn't been confirmed firsthand yet; it's shown
  // inline like this, but never counted toward marking an answer Ready
  // (that rule is enforced in the database itself, not just visually here).
  const renderEvidenceItem = e => {
    const citationText = e.source_citation || e.description;
    const citation = e.file_reference
      ? `<a href="${e.file_reference}" target="_blank" rel="noopener">${citationText}</a>`
      : citationText;
    return `
    <span class="evidence-item">
      <span class="tier-tag tier-${e.verification_tier}">${e.verification_tier === 'verified' ? 'VERIFIED' : 'LEAD'}</span>
      ${citation}
    </span>`;
  };

  const stagesHtml = stages.map(st => {
    const answers = answersByStage[st.stage_number] || [];
    const rows = answers.length
      ? answers.map(a => `
          <div class="qa-row">
            <div class="qa-prompt"><span class="qa-status-dot" style="background:${statusColor(a.status)}"></span>${a.assessment_questions.prompt}</div>
            <div class="qa-answer">${(a.answer_value && a.answer_value.value) ? a.answer_value.value : JSON.stringify(a.answer_value)}</div>
            ${a.evidence_records && a.evidence_records.length ? `<div class="evidence-list">${a.evidence_records.map(renderEvidenceItem).join('')}</div>` : ''}
          </div>`).join('')
      : `<p class="qa-empty">Not yet assessed.</p>`;
    return `
      <div class="stage-block">
        <h3>${st.name}</h3>
        <p class="stage-desc">${st.description}</p>
        ${rows}
      </div>`;
  }).join('');

  // ---- Research Leads: every lead-tier piece of evidence across the
  // whole site, gathered into one place so an unconfirmed newspaper
  // mention or informal tip never just gets lost inside a stage block --
  // it's a visible to-do, not buried evidence.
  const allLeads = [];
  siteAnswers.forEach(a => {
    (a.evidence_records || []).forEach(e => {
      if (e.verification_tier === 'lead') {
        allLeads.push({ prompt: a.assessment_questions.prompt, ...e });
      }
    });
  });
  const leadsHtml = allLeads.length
    ? `<div class="item-list">${allLeads.map(l => {
        const citationText = l.source_citation || l.description;
        const citation = l.file_reference
          ? `<a href="${l.file_reference}" target="_blank" rel="noopener">${citationText}</a>`
          : citationText;
        return `
        <div class="item-row lead-row">
          <div>
            <div class="name">${citation}</div>
            <div class="sub">Relates to: ${l.prompt}</div>
          </div>
          <span class="tier-tag tier-lead">LEAD</span>
        </div>`;
      }).join('')}</div>`
    : `<p class="qa-empty">No open research leads right now.</p>`;

  // ---- Sources to Verify: unread sources still to check, distinct from
  // the "Research leads" above (which are sources we HAVE read, just not
  // yet confirmed firsthand). This section is genuinely unread material --
  // pointers, not evidence.
  const priorityOrder = { high: 0, medium: 1, low: 2 };
  const sortedLeads = [...researchLeads].sort((a, b) => priorityOrder[a.priority] - priorityOrder[b.priority]);
  const renderSourcePointer = p => {
    if (!p) return '';
    const isUrl = /^https?:\/\//i.test(p);
    return isUrl ? `<a href="${p}" target="_blank" rel="noopener">${p}</a>` : p;
  };
  const verifyHtml = sortedLeads.length
    ? `<div class="item-list">${sortedLeads.map(l => `
        <div class="item-row verify-row verify-${l.priority}">
          <div style="flex:1;">
            <div class="name">${l.description}</div>
            <div class="sub">${l.stages ? l.stages.name : 'General'}${l.source_pointer ? ' · ' + renderSourcePointer(l.source_pointer) : ''}</div>
            ${l.confirmation_action ? `
              <div class="confirm-action"><span class="confirm-label">TO CONFIRM:</span> ${l.confirmation_action}</div>
            ` : ''}
            ${l.related_data_needs && l.related_data_needs.length ? `
              <details class="related-details">
                <summary>Also capture during this same visit (${l.related_data_needs.length})</summary>
                <ul class="related-needs">${l.related_data_needs.map(n => `<li>${n}</li>`).join('')}</ul>
              </details>
            ` : ''}
          </div>
          <span class="priority-tag priority-${l.priority}">${l.priority.toUpperCase()}</span>
        </div>`).join('')}</div>`
    : `<p class="qa-empty">No open items to verify right now.</p>`;

  // ---- Components ----
  const componentsHtml = components.length
    ? `<div class="item-list">${components.map(c => `
        <div class="item-row">
          <div><div class="name">${c.component_name || c.component_type}</div><div class="sub">${c.component_type}</div></div>
          <span class="pill pill-${c.status}">${c.status.replace('_',' ')}</span>
        </div>`).join('')}</div>`
    : `<p class="qa-empty">No components recorded yet.</p>`;

  // ---- Threats ----
  const threatsHtml = threats.length
    ? `<div class="item-list">${threats.map(t => `
        <div class="item-row">
          <div><div class="name">${t.threat_name}</div><div class="sub">Probability ${t.probability ?? '—'} · Severity ${t.severity ?? '—'}${t.value_at_risk ? ' · ' + t.value_at_risk : ''}</div></div>
          <span class="pill pill-${t.danger_tier}">${t.danger_tier}</span>
        </div>`).join('')}</div>`
    : `<p class="qa-empty">No threats recorded yet.</p>`;

  // ---- Map features (list form for now; full map view is a later build) ----
  const mapHtml = mapFeatures.length
    ? `<div class="item-list">${mapFeatures.map(f => `
        <div class="item-row">
          <div><div class="name">${f.name || f.feature_type}</div><div class="sub">${f.feature_type} · ${f.geometry_type}</div></div>
        </div>`).join('')}</div>`
    : `<p class="qa-empty">No boundaries or features mapped yet.</p>`;

  document.getElementById('app').innerHTML = `
    <div class="hero">
      <div class="wrap">
        <span class="mono" style="color:var(--gold); font-size:0.82rem;">CASE STUDY</span>
        <h1>${site.name}</h1>
        <div class="meta">${[site.region, site.country].filter(Boolean).join(', ')}</div>
        ${site.description ? `<p class="desc">${site.description}</p>` : ''}
        ${relatedSite ? `<p class="desc" style="margin-top:14px;"><a href="site.html?site=${relatedSite.site_id}" style="color:var(--gold);">→ Companion case: ${relatedSite.name}</a></p>` : ''}
        <div class="hero-actions">
          <button class="hero-btn" onclick="alert('Under construction — we will deal with the independent API at the end of the project.')">+ Add File / Lead / Evidence</button>
          <a class="hero-btn hero-btn-primary" href="field-packet.html?site=${siteId}">Generate Field Research Packet</a>
        </div>
      </div>
    </div>

    <section>
      <div class="wrap">
        <h2 class="section-title">Which path fits best?</h2>
        <p class="kicker">Coverage shows how much of each path's question bank has evidence so far. Status is the actual verdict — a single failed gatekeeper (e.g. missing community consent) overrides coverage entirely, so the highest percentage is not always the recommended path.</p>
        <div class="paths">${pathCardsHtml}</div>
      </div>
    </section>

    <section class="alt">
      <div class="wrap">
        <h2 class="section-title">Readiness summary</h2>
        <p class="kicker">For each path: what's already documented, what's still missing, and the recommended next step toward being UNESCO-ready.</p>
        <div class="readiness-grid">${readinessHtml}</div>
      </div>
    </section>

    <section>
      <div class="wrap">
        <h2 class="section-title">Research leads</h2>
        <p class="kicker">Real leads worth following up — a newspaper mention, an informal tip — that haven't been confirmed firsthand yet. These can point research in the right direction, but can never on their own mark an answer Ready; that requires verified evidence.</p>
        ${leadsHtml}
      </div>
    </section>

    <section>
      <div class="wrap">
        <h2 class="section-title">Sources to verify</h2>
        <p class="kicker">Genuinely unread material, not yet extracted at all — distinct from the leads above, which have at least been read. Nothing here is evidence of any kind until someone actually reads it.</p>
        ${verifyHtml}
      </div>
    </section>

    <section class="alt">
      <div class="wrap">
        <h2 class="section-title">Site record</h2>
        <p class="kicker">Facts about the place itself — shared by all three paths above, recorded once.</p>
        ${stagesHtml}
      </div>
    </section>

    <section>
      <div class="wrap">
        <h2 class="section-title">Conservation status by component</h2>
        ${componentsHtml}
      </div>
    </section>

    <section class="alt">
      <div class="wrap">
        <h2 class="section-title">Threats</h2>
        ${threatsHtml}
      </div>
    </section>

    <section>
      <div class="wrap">
        <h2 class="section-title">Boundaries &amp; features</h2>
        <p class="kicker">Listed for now; an interactive map view is a planned addition.</p>
        ${mapHtml}
      </div>
    </section>
  `;
}

renderSite().catch(e => { console.error(e); renderEmpty('Something went wrong loading this site.'); });
</script>

</body>
</html>
