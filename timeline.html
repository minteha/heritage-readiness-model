<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timeline - Heritage Readiness Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #23261F; --ink-soft: #4A4E42; --line: #D8D2C2; --gold: #B8933A;
    --olive-deep: #4F5C45; --olive: #6B7A5E; --stone-dim: #E1DACB; --alert: #A13D2E;
  }
  * { box-sizing: border-box; }
  .page-shell { display: flex; align-items: flex-start; }
  .sidebar {
    width: 260px; flex-shrink: 0; background: #fff; border-right: 1px solid var(--line);
    padding: 28px 22px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
    scrollbar-width: thin; scrollbar-color: var(--line) transparent;
  }
  .sidebar::-webkit-scrollbar { width: 6px; }
  .sidebar::-webkit-scrollbar-track { background: transparent; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  .sidebar::-webkit-scrollbar-thumb:hover { background: var(--ink-soft); }
  .sidebar h2 { font-size: 1.05rem; margin: 0 0 4px; font-family: 'Fraunces', serif; color: var(--ink); }
  .sidebar .sidebar-sub { font-size: 0.82rem; color: var(--ink-soft); margin-bottom: 20px; }
  .site-link { display: block; padding: 10px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); }
  .site-link:last-child { border-bottom: none; }
  .site-link .site-name { font-weight: 500; font-size: 0.94rem; }
  .site-link .site-region { font-size: 0.8rem; color: var(--ink-soft); font-family: 'IBM Plex Mono', monospace; margin-top: 2px; }
  .site-link-reference { background: #F2F2F0; padding: 10px 10px; border-radius: 4px; border-bottom: 1px solid var(--line); border-left: 3px solid #9B9B94; margin-bottom: 4px; }
  .reference-tag { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; color: #7A7A73; font-weight: 600; letter-spacing: 0.03em; margin-bottom: 3px; }
  .site-link-active { background: #E6F7E9; padding: 10px 10px; border-radius: 4px; border-bottom: 1px solid var(--line); border-left: 3px solid #2EA84A; margin-bottom: 4px; }
  .active-tag { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; color: #1F7A38; font-weight: 600; letter-spacing: 0.03em; margin-bottom: 3px; }
  .site-link-current { outline: 2px solid var(--ink); outline-offset: -2px; }
  .add-case-btn { display: block; text-align: center; font-size: 0.85rem; font-weight: 600; padding: 10px 14px; margin: 8px 0 18px; border: 1px dashed var(--olive); border-radius: 4px; color: var(--olive-deep); text-decoration: none; }
  .add-case-btn:hover { background: var(--stone-dim); }
  .sidebar-error, .sidebar-empty { font-size: 0.85rem; color: var(--ink-soft); }
  .main-col { flex: 1; min-width: 0; max-width: 720px; margin: 0 auto; padding: 0 24px 80px; }
  @media (max-width: 760px) { .page-shell { display: block; } .sidebar { position: static; height: auto; width: auto; border-right: none; border-bottom: 1px solid var(--line); } }
  body {
    font-family: 'IBM Plex Sans', sans-serif; color: var(--ink); background: #fff;
    margin: 0;
  }
  .page-header {
    background: linear-gradient(rgba(35,38,31,0.72), rgba(35,38,31,0.85)), url('miilya-olive-header.jpg');
    background-size: cover; background-position: center 30%;
    margin: 0 -24px 32px; padding: 40px 24px 28px;
  }
  h1 { font-family: 'Fraunces', serif; font-size: 1.8rem; margin: 0 0 6px; color: #fff; }
  .page-header p { color: #E8E4D8; font-size: 0.92rem; margin: 0; }
  .back-link { display: inline-block; margin-bottom: 24px; font-size: 0.88rem; color: var(--ink-soft); text-decoration: none; }

  .timeline { position: relative; padding-left: 4px; }
  .timeline::before { content: ''; position: absolute; left: 88px; top: 8px; bottom: 8px; width: 2px; background: var(--line); }
  .timeline-event { display: flex; gap: 24px; margin-bottom: 28px; position: relative; }
  .timeline-year {
    width: 88px; flex-shrink: 0; text-align: right; padding-right: 20px;
    font-family: 'Fraunces', serif; font-size: 1.05rem; font-weight: 600; color: var(--olive-deep);
    position: relative;
  }
  .timeline-year::after {
    content: ''; position: absolute; right: -5px; top: 5px; width: 12px; height: 12px;
    border-radius: 50%; background: var(--gold); border: 2px solid #fff; box-shadow: 0 0 0 1px var(--gold);
  }
  .timeline-body { flex: 1; padding-bottom: 4px; }
  .timeline-title { font-weight: 600; font-size: 1rem; margin-bottom: 4px; }
  .timeline-desc { font-size: 0.92rem; color: var(--ink-soft); margin: 0 0 6px; }
  .timeline-source { font-size: 0.8rem; color: var(--ink-soft); font-style: italic; }
  .empty-note { font-size: 0.9rem; color: var(--ink-soft); font-style: italic; }
</style>
</head>
<body>
<div class="page-shell">
<aside class="sidebar">
  <h2>Case Studies</h2>
  <p class="sidebar-sub">All sites assessed with this model.</p>
  <div id="site-list">
    <p class="mono" style="font-size:0.82rem; color:var(--ink-soft);">Loading&hellip;</p>
  </div>
</aside>
<div class="main-col">
<div id="app"><p style="padding-top:40px;">Loading...</p></div>
</div>
</div>

<script>
const SUPABASE_URL = 'https://dntqhsrxbmhdbfyqnimk.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRudHFoc3J4Ym1oZGJmeXFuaW1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4OTk1NTIsImV4cCI6MjEwNDQ3NTU1Mn0.SyxoJflfFLX3UkqK7HKaJES2DGdjuI5BjnWz3YYIsiE';

async function api(path) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
  });
  if (!res.ok) throw new Error(`API error: ${res.status}`);
  return res.json();
}

async function renderTimeline() {
  const params = new URLSearchParams(window.location.search);
  const siteId = params.get('site');
  if (!siteId) { document.getElementById('app').innerHTML = '<p>No site selected.</p>'; return; }

  const [sites, timelineEvents] = await Promise.all([
    api(`sites?site_id=eq.${siteId}&select=name`),
    api(`timeline_events?site_id=eq.${siteId}&select=*&order=year_start.asc`)
  ]);
  const site = sites[0];
  if (!site) { document.getElementById('app').innerHTML = '<p>Site not found.</p>'; return; }
  document.title = `Timeline - ${site.name}`;

  const timelineHtml = timelineEvents && timelineEvents.length
    ? `<div class="timeline">${timelineEvents.map(t => `
        <div class="timeline-event">
          <div class="timeline-year">${t.year_start}${t.year_end ? '\u2013' + t.year_end : ''}</div>
          <div class="timeline-body">
            <div class="timeline-title">${t.title}</div>
            <p class="timeline-desc">${t.description}</p>
            ${t.source_citation ? `<div class="timeline-source">${t.source_citation}</div>` : ''}
          </div>
        </div>`).join('')}</div>`
    : `<p class="empty-note">No dated events recorded yet for this site.</p>`;

  document.getElementById('app').innerHTML = `
    <div class="page-header">
      <h1>Timeline</h1>
      <p>${site.name}</p>
    </div>
    <a class="back-link" href="site.html?site=${siteId}">&larr; Back to case study</a>
    ${timelineHtml}
  `;
}
renderTimeline().catch(e => { console.error(e); document.getElementById('app').innerHTML = '<p>Something went wrong loading this timeline.</p>'; });

// Shared sidebar, present on every page so switching between case studies
// never requires a trip back to the homepage.
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
async function loadSidebarSites() {
  const container = document.getElementById('site-list');
  const currentSiteId = new URLSearchParams(window.location.search).get('site');
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/sites?select=*&order=is_reference_case.asc,name.asc`, {
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
    });
    if (!res.ok) throw new Error('fetch failed');
    const sites = await res.json();
    if (!sites.length) {
      container.innerHTML = '<p class="sidebar-empty">No case studies yet.</p>';
      return;
    }
    container.innerHTML = '';
    const activeSites = sites.filter(s => !s.is_reference_case);
    // Olive orchards are our actual primary nomination target, shown first.
    const PRIMARY_SITE_ID = '85b8c3ba-812d-4aa6-a4ef-02664245a540';
    activeSites.sort((a, b) => (a.site_id === PRIMARY_SITE_ID ? -1 : b.site_id === PRIMARY_SITE_ID ? 1 : 0));
    const referenceSites = sites.filter(s => s.is_reference_case);

    activeSites.forEach(s => {
      const a = document.createElement('a');
      a.className = `site-link site-link-active${s.site_id === currentSiteId ? ' site-link-current' : ''}`;
      a.href = `site.html?site=${encodeURIComponent(s.site_id)}`;
      const region = [s.region, s.country].filter(Boolean).join(', ');
      a.innerHTML = `
        <span class="active-tag">ACTIVE STUDY CASE</span>
        <div class="site-name">${escapeHtml(s.name)}</div>
        ${region ? `<div class="site-region">${escapeHtml(region)}</div>` : ''}
      `;
      container.appendChild(a);
    });

    const addCaseLink = document.createElement('a');
    addCaseLink.className = 'add-case-btn';
    addCaseLink.href = 'add-study-case.html';
    addCaseLink.innerHTML = '+ Add New Study Case';
    container.appendChild(addCaseLink);

    referenceSites.forEach(s => {
      const a = document.createElement('a');
      a.className = `site-link site-link-reference${s.site_id === currentSiteId ? ' site-link-current' : ''}`;
      a.href = `site.html?site=${encodeURIComponent(s.site_id)}`;
      const region = [s.region, s.country].filter(Boolean).join(', ');
      a.innerHTML = `
        <span class="reference-tag">COMPLETE STUDY CASE</span>
        <div class="site-name">${escapeHtml(s.name)}</div>
        ${region ? `<div class="site-region">${escapeHtml(region)}</div>` : ''}
      `;
      container.appendChild(a);
    });
  } catch (e) {
    container.innerHTML = '<p class="sidebar-error">Could not load case studies.</p>';
    console.error(e);
  }
}
loadSidebarSites();
</script>
</body>
</html>
